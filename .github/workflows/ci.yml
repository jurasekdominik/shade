name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Documentation contracts
        run: |
          python -m unittest discover -s gallery -p test_docs_check.py
          python gallery/docs_check.py
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format whitespace Shade.slnx --verify-no-changes
      - run: dotnet build Shade.slnx -c Release -warnaserror
      - run: dotnet run --project tests/Shade.Tests -c Release --no-build
